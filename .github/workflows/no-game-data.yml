name: No Game Data
on:
  push:
    branches: [open-vice-fx, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: no-game-data-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  no-game-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: No game data tracked
        run: python3 -I scripts/check_no_game_data.py
